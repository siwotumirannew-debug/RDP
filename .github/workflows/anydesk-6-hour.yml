
name: Windows ARM AnyDesk - 6 Hours

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-anydesk:
    # Runner harus tersedia dan Anda memiliki izin mengelolanya.
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 360

    steps:
      - name: Install AnyDesk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'AnyDesk.exe'

          Invoke-WebRequest `
            -Uri 'https://download.anydesk.com/AnyDesk.exe' `
            -OutFile $installer

          $installDir = 'C:\Program Files (x86)\AnyDesk'

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--install `"$installDir`" --silent" `
            -Wait

          $possiblePaths = @(
            'C:\Program Files (x86)\AnyDesk\AnyDesk.exe',
            'C:\Program Files\AnyDesk\AnyDesk.exe'
          )

          $anydesk = $possiblePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $anydesk) {
            throw 'AnyDesk executable tidak ditemukan.'
          }

          "ANYDESK_EXE=$anydesk" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure AnyDesk credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path $env:ANYDESK_EXE)) {
            throw 'AnyDesk executable tidak ditemukan.'
          }

          # Kompatibel dengan .NET versi lama.
          $rng = New-Object System.Security.Cryptography.RNGCryptoServiceProvider
          $bytes = New-Object byte[] 24

          try {
            $rng.GetBytes($bytes)
          }
          finally {
            $rng.Dispose()
          }

          $password = [Convert]::ToBase64String($bytes).
            TrimEnd('=').
            Replace('+', 'A').
            Replace('/', 'B')

          # Perintah ini harus didukung versi AnyDesk yang dipasang.
          $password | & $env:ANYDESK_EXE --set-password

          if ($LASTEXITCODE -ne 0) {
            throw 'Gagal mengatur password AnyDesk. Periksa dukungan CLI versi yang terpasang.'
          }

          Start-Sleep -Seconds 5

          $idOutput = & $env:ANYDESK_EXE --get-id
          $id = ($idOutput | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw 'AnyDesk ID tidak berhasil diperoleh.'
          }

          $directory = Join-Path $PWD 'session-info'
          New-Item -ItemType Directory -Force -Path $directory |
            Out-Null

          $content = @"
          AnyDesk ID: $id
          Password: $password
          Session duration: 6 hours
          "@

          $file = Join-Path $directory 'credentials.txt'
          Set-Content -Path $file -Value $content -Encoding UTF8

          # Password tidak ditampilkan di log.
          Write-Host "AnyDesk ID: $id"
          Write-Host 'Kredensial tersedia sebagai artefak privat.'

      - name: Six-hour countdown
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $end = (Get-Date).AddHours(6)

          while ((Get-Date) -lt $end) {
            $remaining = [int]($end - (Get-Date)).TotalSeconds

            $hours = [math]::Floor($remaining / 3600)
            $minutes = [math]::Floor(($remaining % 3600) / 60)
            $seconds = $remaining % 60

            Write-Host (
              'Time remaining: {0:D2}:{1:D2}:{2:D2}' -f
              $hours, $minutes, $seconds
            )

            Start-Sleep -Seconds (
              [Math]::Min(60, [Math]::Max(1, $remaining))
            )
          }

      - name: Upload credentials
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-session-credentials
          path: session-info/credentials.txt
          retention-days: 1
          if-no-files-found: error

      - name: Finish session
        if: always()
        shell: powershell
        run: |
          Write-Host 'Workflow enam jam telah selesai.'
